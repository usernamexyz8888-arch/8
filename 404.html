<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>My🔥Page</title>

<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #000;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

main {
  display: none;
  width: 100%;
  max-width: 420px;
  padding: 28px 22px;
  margin: 0 auto;
  text-align: center;
  background: #191920;
  border: 1px solid #34343d;
  border-radius: 18px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

h2 {
  font-size: 23px;
  margin-top: 0;
}

p {
  color: #d1d1d8;
  line-height: 1.6;
}

.link-button,
button {
  display: inline-block;
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #ff4fa0;
  color: #171018;
  font-size: 16px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
  animation: buttonShake 1.8s infinite;
}

@keyframes buttonShake {
  0%, 80%, 100% {
    transform: translateX(0);
  }
  82% {
    transform: translateX(-3px);
  }
  84% {
    transform: translateX(3px);
  }
  86% {
    transform: translateX(-3px);
  }
  88% {
    transform: translateX(3px);
  }
  90% {
    transform: translateX(0);
  }
}

.hidden {
  display: none !important;
}

.goog-te-banner-frame,
.goog-te-gadget,
.goog-te-balloon-frame {
  display: none !important;
}

body {
  top: 0 !important;
}
</style>
</head>

<body>
<main>

<section id="indonesia" class="hidden">
</section>

<section id="international" class="hidden">
  <h2 id="destination-title">🍆🍑👅💦</h2>
  <p id="destination-text"></p>
  <a class="link-button"
     id="destination-link"
     href="https://byuxyz8.github.io/mypage/akQns7pdM8"
     target="_blank"
     rel="noopener noreferrer">
    👉🏻 Click Here
  </a>
</section>

<div id="google_translate_element" class="hidden"></div>

</main>

<script>
(function () {
  "use strict";

  function show(id) {
    var main = document.querySelector("main");
    var indonesia = document.getElementById("indonesia");
    var international = document.getElementById("international");

    indonesia.classList.add("hidden");
    international.classList.add("hidden");

    if (id === "indonesia") {
      document.documentElement.style.background = "#000";
      document.body.style.background = "#000";
      document.body.style.padding = "0";
      main.style.display = "none";
      return;
    }

    document.documentElement.style.background = "#101014";
    document.body.style.background = "#101014";
    document.body.style.padding = "0";
    main.style.display = "block";
    international.classList.remove("hidden");
  }

  function setLanguage(lang) {
    document.documentElement.lang = lang;

    var t = {
      en: {
        title: "My Page",
        continue: "🍆🍑👅💦",
        description: "",
        open: "👉🏻 Click Here"
      }
    };

    var x = t[lang] || t.en;
    document.title = x.title;
    document.getElementById("destination-title").textContent = x.continue;
    document.getElementById("destination-text").textContent = x.description;
    document.getElementById("destination-link").textContent = x.open;
  }

  function translatePage() {
    if (window.google && google.translate) {
      new google.translate.TranslateElement({
        pageLanguage: "en",
        autoDisplay: false
      }, "google_translate_element");
    }
  }

  window.googleTranslateElementInit = translatePage;

  function loadGoogleTranslate(browserLang) {
    if (browserLang === "en") return;

    var script = document.createElement("script");
    script.src =
      "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
    script.onerror = function () {};
    document.head.appendChild(script);

    var attempts = 0;
    var timer = setInterval(function () {
      attempts++;
      var select = document.querySelector(".goog-te-combo");

      if (select) {
        clearInterval(timer);
        select.value = browserLang;
        select.dispatchEvent(new Event("change"));
      }

      if (attempts >= 20) clearInterval(timer);
    }, 500);
  }

  fetch("https://ipapi.co/json/", { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("Location lookup failed");
      return response.json();
    })
    .then(function (data) {
      if (!data || !data.country_code) {
        throw new Error("Country unavailable");
      }

      if (data.country_code === "ID") {
        show("indonesia");
        return;
      }

      setLanguage("en");
      show("international");

      var browserLang =
        (navigator.languages && navigator.languages[0]) ||
        navigator.language ||
        "en";

      browserLang = browserLang.split("-")[0].toLowerCase();
      loadGoogleTranslate(browserLang);
    })
    .catch(function () {
      setLanguage("en");
      show("international");
    });
})();
</script>

</body>
  </html>
