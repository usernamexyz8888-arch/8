<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>My Page</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  background: #101014;
}
#blocked {
  display: none;
  color: #fff;
  font: 16px/1.5 Arial, sans-serif;
  text-align: center;
  padding: 24px;
}
#preview {
  display: none;
  position: relative;
  width: min(100%, 420px);
  aspect-ratio: 9 / 16;
  max-height: 82vh;
  overflow: hidden;
  border-radius: 16px;
  background:
    radial-gradient(ellipse at 50% 28%, rgba(255,190,207,.75), transparent 27%),
    radial-gradient(ellipse at 50% 70%, rgba(117,36,83,.75), transparent 42%),
    linear-gradient(155deg, #e6b7bd 0%, #8e5d71 42%, #211922 100%);
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
  text-decoration: none;
  cursor: pointer;
}
#preview::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.14));
}
.play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: rgba(20,20,24,.62);
  border: 1px solid rgba(255,255,255,.8);
  display: grid;
  place-items: center;
}
.play::after {
  content: "";
  margin-left: 5px;
  width: 0;
  height: 0;
  border-top: 15px solid transparent;
  border-bottom: 15px solid transparent;
  border-left: 23px solid #fff;
}
.external {
  position: absolute;
  right: 13px;
  bottom: 13px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: white;
  background: rgba(20,20,24,.55);
  font: 18px Arial, sans-serif;
}
</style>
</head>
<body>
<div id="blocked" role="status">Sorry, this link is not available in your country.</div>
<a id="preview" href="https://byuxyz8.github.io/mypage/" aria-label="Open destination page">
  <span class="play" aria-hidden="true"></span>
  <span class="external" aria-hidden="true">↗</span>
</a>
<script>
(async function () {
  const blocked = document.getElementById("blocked");
  const preview = document.getElementById("preview");
  try {
    const response = await fetch("https://ipapi.co/json/", { cache: "no-store" });
    if (!response.ok) throw new Error("Country lookup failed");
    const data = await response.json();
    if (!data || !data.country_code) throw new Error("Country unavailable");

    if (data.country_code === "ID") {
      blocked.style.display = "block";
      document.body.style.background = "#101014";
    } else {
      preview.style.display = "block";
    }
  } catch (error) {
    // Fail closed: if the country cannot be checked, do not expose the destination.
    blocked.style.display = "block";
  }
})();
</script>
</body>
</html>
