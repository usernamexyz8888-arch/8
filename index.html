<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#10060d">
<title>Na, neugierig? 😉</title>

<style>
:root {
  --bg: #080509;
  --panel: #160d16;
  --panel-border: rgba(255, 72, 157, .42);
  --pink: #ff2589;
  --pink-light: #ff72bb;
  --text: #fff8fc;
  --muted: #dfcbd8;
  /* Ganti ikon tombol di sini, misalnya: "💋", "❤️", "🔥", "😉" */
  --button-icon: "💋";
}
* { box-sizing: border-box; }

html {
  min-height: 100%;
  background: var(--bg);
}
body {
  margin: 0;
  min-height: 100vh;
  padding: 22px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255, 28, 126, .16), transparent 52%),
    var(--bg);
}
main {
  display: none;
  width: 100%;
  max-width: 440px;
  margin: auto;
}
.card {
  position: relative;
  overflow: hidden;
  padding: 28px 22px 24px;
  text-align: center;
  border: 1px solid var(--panel-border);
  border-radius: 26px;
  background:
    radial-gradient(ellipse at 50% 5%, rgba(255, 38, 139, .12), transparent 42%),
    linear-gradient(160deg, #1b101b 0%, var(--panel) 58%, #120811 100%);
  box-shadow: 0 0 34px rgba(255, 24, 126, .10), inset 0 0 26px rgba(255, 70, 155, .035);
}
.card::before,
.card::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  filter: blur(48px);
  opacity: .16;
  pointer-events: none;
}
.card::before {
  top: -90px;
  left: -70px;
  background: #ff1686;
}
.card::after {
  right: -95px;
  bottom: -100px;
  background: #ff1686;
}
.lips-art {
  position: relative;
  z-index: 1;
  width: 138px;
  height: 122px;
  margin: 0 auto 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 0 8px rgba(255, 35, 137, .85));
}
.lips-art svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
h1 {
  position: relative;
  z-index: 1;
  margin: 8px 0 14px;
  font-size: clamp(27px, 7vw, 34px);
  line-height: 1.16;
  letter-spacing: -.7px;
  font-weight: 800;
  text-shadow: 0 0 18px rgba(255, 82, 166, .18);
}
.description {
  position: relative;
  z-index: 1;
  margin: 0 auto 25px;
  max-width: 340px;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.65;
}
.link-button {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 68px;
  margin: 0 auto;
  padding: 17px 18px;
  border: 1px solid rgba(255, 202, 228, .5);
  border-radius: 999px;
  background: linear-gradient(105deg, #ff3a99, #f51c7c 55%, #ff398f);
  box-shadow: 0 8px 26px rgba(255, 24, 126, .27), inset 0 1px 0 rgba(255,255,255,.24);
  color: #fff;
  font-size: 19px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  -webkit-tap-highlight-color: transparent;
}
.link-button::before {
  content: var(--button-icon);
  font-size: 27px;
  line-height: 1;
}
.link-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
  box-shadow: 0 10px 30px rgba(255, 24, 126, .38);
}
.link-button:active { transform: scale(.985); }
.tagline {
  position: relative;
  z-index: 1;
  margin: 20px 0 0;
  color: #d9bdce;
  font-size: 13px;
  line-height: 1.5;
}
.hidden { display: none !important; }

/* Hide Google Translate UI if it is loaded */
.goog-te-banner-frame,
.goog-te-banner-frame.skiptranslate,
.goog-te-gadget,
.goog-te-balloon-frame,
.goog-te-menu-frame,
.goog-te-spinner-pos,
#goog-gt-tt,
.goog-tooltip,
.goog-tooltip:hover,
#google_translate_element,
body > .skiptranslate {
  display: none !important;
  visibility: hidden !important;
  height: 0 !important;
  width: 0 !important;
  overflow: hidden !important;
}
html, body { top: 0 !important; }

@media (max-width: 360px) {
  body { padding: 14px 10px; }
  .card { padding: 23px 17px 20px; border-radius: 22px; }
  .lips-art { width: 120px; height: 108px; }
  .description { font-size: 16px; }
  .link-button { min-height: 62px; font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>

<body>
<main>
  <section id="indonesia" class="hidden" aria-hidden="true"></section>

  <section id="international" class="card hidden" aria-labelledby="destination-title">
    <div class="lips-art" aria-hidden="true">
      <!-- Neon lips + small heart + glossy drip -->
      <svg viewBox="0 0 220 170" role="img" aria-label="Neonpinke Lippen mit sichtbaren Zähnen, herausgestreckter Zunge, Tropfen und Herz">
<defs>
 <linearGradient id="lipFill" x1="0" y1="0" x2=".2" y2="1">
  <stop offset="0" stop-color="#ffb9e2"/><stop offset=".25" stop-color="#ff3195"/><stop offset=".7" stop-color="#c9005b"/><stop offset="1" stop-color="#ff73bd"/>
 </linearGradient>
 <linearGradient id="tongueFill" x1="0" y1="0" x2=".8" y2="1">
  <stop offset="0" stop-color="#ffd0eb"/><stop offset=".4" stop-color="#ff4ca4"/><stop offset="1" stop-color="#e90069"/>
 </linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="190%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>
<path d="M176 26 C166 12 150 16 149 28 C147 40 163 50 177 61 C190 49 206 39 202 26 C198 14 184 15 176 26Z" fill="none" stroke="#ff4ca8" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>
<g filter="url(#glow)" stroke="#ff3198" stroke-linejoin="round" stroke-linecap="round">
 <path d="M17 91 C32 75 48 51 69 42 C83 36 94 40 107 47 C116 52 121 51 130 44 C145 34 159 39 174 52 C189 66 198 82 205 91 C188 97 174 108 158 116 C141 126 124 131 106 129 C82 127 55 115 36 103 C27 98 21 94 17 91Z" fill="url(#lipFill)" stroke-width="2.5"/>
 <path d="M18 91 C42 86 62 73 82 73 C96 73 103 80 112 80 C128 79 146 72 165 78 C182 83 194 89 205 91 C186 101 169 105 151 105 C133 105 122 99 109 99 C88 99 65 104 46 101 C34 99 25 95 18 91Z" fill="#210014" stroke="#ff78bf" stroke-width="1.5"/>
 <path d="M76 76 Q87 72 98 78 L98 91 Q87 94 78 89Z" fill="#fffaff" stroke="#ffd1e9" stroke-width="1.3"/>
 <path d="M100 78 Q117 80 134 78 L132 92 Q116 94 100 91Z" fill="#fffaff" stroke="#ffd1e9" stroke-width="1.3"/>
 <path d="M136 80 Q147 79 157 84 L151 94 L133 91Z" fill="#ffe7f5" stroke="#ffd1e9" stroke-width="1.2"/>
 <path d="M119 92 C134 82 151 73 166 77 C178 80 180 90 173 99 C166 108 151 111 140 116 C130 121 122 117 120 109 C119 103 123 98 131 95 Q124 97 119 92Z" fill="url(#tongueFill)" stroke="#ff7cbe" stroke-width="2"/>
 <path d="M137 91 Q153 82 168 84" fill="none" stroke="#ffe0f2" stroke-width="2.5"/>
 <path d="M18 92 C40 99 63 103 86 101 C102 100 114 96 127 98 C145 101 161 98 178 92 C168 109 153 122 134 132 C117 140 99 139 80 133 C55 124 34 108 18 92Z" fill="url(#lipFill)" stroke-width="2.3"/>
 <path d="M43 68 Q61 47 81 48 M131 48 Q149 43 169 62" fill="none" stroke="#ffe1f2" stroke-width="3.2"/>
 <path d="M38 108 Q62 128 91 132 M101 119 Q123 128 146 110" fill="none" stroke="#ffb7dd" stroke-width="2.6"/>
 <path d="M155 105 C155 117 160 125 157 137 C155 146 148 146 147 137 C146 128 151 118 151 108Z" fill="url(#tongueFill)" stroke="#ff78bd" stroke-width="2"/>
 <path d="M153 111 Q150 126 151 136" fill="none" stroke="#fff0fa" stroke-width="1.8"/>
</g>
<circle cx="211" cy="67" r="2.4" fill="#ff9bd2" filter="url(#glow)"/><circle cx="199" cy="75" r="1.8" fill="#ff72bd" filter="url(#glow)"/>
</svg>
    </div>

    <h1 id="destination-title">Na, neugierig? 😉</h1>
    <p class="description" id="destination-text">Vielleicht wartet etwas Interessantes auf dich …</p>

    <a class="link-button"
       id="destination-link"
       href="https://byuxyz8.github.io/mypage/akQns7pdM8"
       target="_blank"
       rel="noopener noreferrer">
      Jetzt entdecken
    </a>

    <p class="tagline" id="destination-tagline">Ein Klick. Neue Möglichkeiten. ✨</p>
  </section>

  <div id="google_translate_element" class="hidden"></div>
</main>

<script>
(function () {
  "use strict";

  function show(id) {
    var main = document.querySelector("main");
    var indonesia = document.getElementById("indonesia");
    var international = document.getElementById("international");

    indonesia.classList.add("hidden");
    international.classList.add("hidden");

    if (id === "indonesia") {
      document.documentElement.style.background = "#000";
      document.body.style.background = "#000";
      main.style.display = "none";
      return;
    }

    document.documentElement.style.background = "#080509";
    document.body.style.background = "#080509";
    main.style.display = "block";
    international.classList.remove("hidden");
  }

  function setLanguage(lang) {
    var translations = {
      de: {
        title: "Na, neugierig? 😉",
        description: "Vielleicht wartet etwas Interessantes auf dich …",
        open: "Jetzt entdecken",
        tagline: "Ein Klick. Neue Möglichkeiten. ✨",
        pageTitle: "Na, neugierig? 😉"
      },
      en: {
        title: "Curious? 😉",
        description: "Something interesting might be waiting for you …",
        open: "Discover now",
        tagline: "One click. New possibilities. ✨",
        pageTitle: "Curious? 😉"
      },
      fr: {
        title: "Curieux ? 😉",
        description: "Quelque chose d’intéressant t’attend peut-être …",
        open: "Découvrir",
        tagline: "Un clic. De nouvelles possibilités. ✨",
        pageTitle: "Curieux ? 😉"
      },
      es: {
        title: "¿Tienes curiosidad? 😉",
        description: "Quizá haya algo interesante esperándote …",
        open: "Descubrir ahora",
        tagline: "Un clic. Nuevas posibilidades. ✨",
        pageTitle: "¿Tienes curiosidad? 😉"
      },
      it: {
        title: "Sei curioso? 😉",
        description: "Forse c’è qualcosa di interessante che ti aspetta …",
        open: "Scopri ora",
        tagline: "Un clic. Nuove possibilità. ✨",
        pageTitle: "Sei curioso? 😉"
      },
      nl: {
        title: "Nieuwsgierig? 😉",
        description: "Misschien wacht er iets leuks op je …",
        open: "Ontdek nu",
        tagline: "Eén klik. Nieuwe mogelijkheden. ✨",
        pageTitle: "Nieuwsgierig? 😉"
      }
    };

    var x = translations[lang] || translations.en;
    document.documentElement.lang = translations[lang] ? lang : "en";
    document.title = x.pageTitle;
    document.getElementById("destination-title").textContent = x.title;
    document.getElementById("destination-text").textContent = x.description;
    document.getElementById("destination-link").textContent = x.open;
    document.getElementById("destination-tagline").textContent = x.tagline;
  }

  function translatePage() {
    if (window.google && google.translate) {
      new google.translate.TranslateElement({
        pageLanguage: "de",
        autoDisplay: false
      }, "google_translate_element");
    }
  }
  window.googleTranslateElementInit = translatePage;

  function loadGoogleTranslate(browserLang) {
    /* German is always the original/default page language. */
    setLanguage("de");

    if (!browserLang || browserLang === "de") return;

    var script = document.createElement("script");
    script.src =
      "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
    script.onerror = function () {};

    window.googleTranslateElementInit = function () {
      if (window.google && google.translate) {
        new google.translate.TranslateElement({
          pageLanguage: "de",
          autoDisplay: false,
          includedLanguages: "en,fr,es,it,nl,pt,pl,ru,tr,id"
        }, "google_translate_element");
      }
    };

    document.head.appendChild(script);

    var attempts = 0;
    var timer = setInterval(function () {
      attempts++;
      var select = document.querySelector(".goog-te-combo");

      if (select) {
        clearInterval(timer);
        select.value = browserLang;
        select.dispatchEvent(new Event("change"));
      }

      if (attempts >= 30) clearInterval(timer);
    }, 500);
  }

  fetch("https://ipapi.co/json/", { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("Location lookup failed");
      return response.json();
    })
    .then(function (data) {
      if (!data || !data.country_code) throw new Error("Country unavailable");

      /* Existing behavior retained: visitors detected in Indonesia see no LP. */
      if (data.country_code === "ID") {
        show("indonesia");
        return;
      }

      var browserLang =
        (navigator.languages && navigator.languages[0]) ||
        navigator.language ||
        "en";
      browserLang = browserLang.split("-")[0].toLowerCase();

      setLanguage("de");
      show("international");
      loadGoogleTranslate(browserLang);
    })
    .catch(function () {
      setLanguage("en");
      show("international");
    });
})();
</script>
</body>
        </html>
